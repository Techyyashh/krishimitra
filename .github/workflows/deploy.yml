name: Deploy live demo (Hugging Face Static Space)

# Runs after CI passes on main. Set up once (see docs/DEPLOYMENT.md):
#   Repository secret   HF_TOKEN       – a Hugging Face "write" token
#   Repository variable HF_SPACE_ID    – e.g. Techyyashh/krishimitra
#   Repository variable HF_MODEL_REPO  – e.g. Techyyashh/krishimitra-model
# The model is not in Git, so it is downloaded from the Hub before building the static site.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install huggingface_hub==0.26.2

      - name: Download the model from the Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from huggingface_hub import hf_hub_download as d; [d('${{ vars.HF_MODEL_REPO }}', f, local_dir='models') for f in ('krishimitra.onnx', 'classes.json')]"

      - name: Build and upload the static site
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/build_static.py --deploy --space "${{ vars.HF_SPACE_ID }}"
